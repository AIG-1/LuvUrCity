backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"
site_url: https://luvurcity.netlify.app
display_url: https://luvurcity.netlify.app
logo_url: /images/favicon.svg

collections:
  - name: "homepage"
    label: "Homepage"
    files:
      # ---------- SITE SETTINGS ----------
      - name: "site"
        label: "Site Settings, Hero, Why, Booking, Footer"
        file: "data/site.json"
        fields:
          - {label: "Brand name", name: "brand", widget: "string"}
          - {label: "Brand line", name: "brandLine", widget: "string"}
          - {label: "Agent name", name: "agentName", widget: "string"}
          - {label: "Agent title", name: "agentTitle", widget: "string"}
          - {label: "Tagline", name: "tagline", widget: "string"}
          - {label: "Logo (leave empty to show text logo)", name: "logo", widget: "image", required: false}
          - {label: "Headshot photo", name: "headshot", widget: "image"}
          - {label: "Phone", name: "phone", widget: "string"}
          - {label: "Email — Insurance", name: "emailInsurance", widget: "string"}
          - {label: "Email — Consulting / City services", name: "emailCity", widget: "string"}
          - {label: "Booking link (Calendly)", name: "bookingUrl", widget: "string"}
          - {label: "NPN", name: "npn", widget: "string"}
          - {label: "Licensed states (wording)", name: "licensedStates", widget: "string"}
          - {label: "Service area", name: "serviceArea", widget: "string"}
          - {label: "Instagram URL", name: "instagram", widget: "string", required: false}
          - {label: "Facebook URL", name: "facebook", widget: "string", required: false}
          - {label: "X URL", name: "x", widget: "string", required: false}
          - {label: "Snapchat URL", name: "snapchat", widget: "string", required: false}
          - {label: "Show 'Concept preview' bar", name: "conceptPreview", widget: "boolean", default: false}
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Small line above headline", name: "eyebrow", widget: "string"}
              - {label: "Headline", name: "headline", widget: "string"}
              - {label: "Subheadline", name: "subhead", widget: "text"}
              - {label: "Main button text", name: "ctaPrimary", widget: "string"}
              - {label: "Second button text", name: "ctaSecondary", widget: "string"}
              - {label: "Trust points", name: "trust", widget: "list", field: {label: "Point", name: "point", widget: "string"}}
          - label: "Why work with me"
            name: "why"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Intro", name: "intro", widget: "text"}
              - label: "Reasons"
                name: "items"
                widget: "list"
                fields:
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "Text", name: "text", widget: "text"}
          - label: "Booking section"
            name: "booking"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Text", name: "text", widget: "text"}
              - {label: "Show calendar embed", name: "embed", widget: "boolean", default: true}
          - label: "Email signup"
            name: "signup"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Text", name: "text", widget: "text"}
          - label: "Footer disclaimers"
            name: "disclaimers"
            widget: "object"
            fields:
              - {label: "Medicare (TPMO) disclaimer — fill in the [#] numbers", name: "tpmo", widget: "text"}
              - {label: "Government disclaimer", name: "government", widget: "text"}
              - {label: "General disclaimer", name: "general", widget: "text"}
              - {label: "Contact consent", name: "consent", widget: "text"}

      # ---------- TICKER ----------
      - name: "ticker"
        label: "Ticker Banner (scrolling links)"
        file: "data/ticker.json"
        fields:
          - {label: "Speed (seconds per loop — higher is slower)", name: "speed", widget: "number", value_type: "int", min: 10, max: 120}
          - label: "Items"
            name: "items"
            widget: "list"
            label_singular: "Item"
            summary: "{{fields.text}}"
            fields:
              - {label: "Text", name: "text", widget: "string"}
              - {label: "Link (e.g. #svc-health, /blog.html, tel:+18727777991, https://...)", name: "link", widget: "string"}

      # ---------- FLYERS ----------
      - name: "flyers"
        label: "Flyer Carousel"
        file: "data/flyers.json"
        fields:
          - {label: "Speed (seconds per loop — higher is slower)", name: "speed", widget: "number", value_type: "int", min: 10, max: 180}
          - label: "Flyers"
            name: "flyers"
            widget: "list"
            label_singular: "Flyer"
            summary: "{{fields.title}}"
            fields:
              - {label: "Flyer image", name: "image", widget: "image"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Description for screen readers (type out the flyer's key text)", name: "alt", widget: "text"}
              - {label: "Link", name: "link", widget: "string", required: false}

      # ---------- SERVICES ----------
      - name: "services"
        label: "Services"
        file: "data/services.json"
        fields:
          - {label: "Homepage section title", name: "title", widget: "string"}
          - {label: "Homepage intro", name: "intro", widget: "text"}
          - {label: "Services page — small label", name: "pageKicker", widget: "string"}
          - {label: "Services page — headline", name: "pageHeadline", widget: "string"}
          - {label: "Services page — intro", name: "pageIntro", widget: "text"}
          - label: "Services"
            name: "services"
            widget: "list"
            label_singular: "Service"
            summary: "{{fields.title}}"
            fields:
              - {label: "Anchor ID (used by ticker links, e.g. svc-health)", name: "id", widget: "string"}
              - {label: "Icon", name: "icon", widget: "select", options: ["heart","smile","shield","dove","wallet","plus","sun","home","chart","users","briefcase"]}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Short text (homepage card)", name: "text", widget: "text"}
              - {label: "Full description (Services page)", name: "details", widget: "text", required: false}
              - {label: "Good fit for (Services page)", name: "whoFor", widget: "list", required: false, field: {label: "Who", name: "who", widget: "string"}}
              - {label: "Type", name: "contact", widget: "select", options: [{label: "Insurance", value: "insurance"}, {label: "Consulting / City services (highlighted)", value: "city"}]}

      # ---------- REVIEWS ----------
      - name: "reviews"
        label: "Reviews (real, approved reviews only)"
        file: "data/reviews.json"
        fields:
          - {label: "Section title", name: "title", widget: "string"}
          - {label: "Text shown when there are no reviews", name: "emptyText", widget: "text"}
          - label: "Reviews"
            name: "reviews"
            widget: "list"
            label_singular: "Review"
            summary: "{{fields.name}} — {{fields.rating}}★"
            required: false
            fields:
              - {label: "Name (first name + last initial)", name: "name", widget: "string"}
              - {label: "City", name: "city", widget: "string", required: false}
              - {label: "Rating", name: "rating", widget: "number", value_type: "int", min: 1, max: 5, default: 5}
              - {label: "Review text (paste exactly as submitted)", name: "text", widget: "text"}
              - {label: "Source (Google, Facebook, website form)", name: "source", widget: "string", required: false}
              - {label: "Published", name: "published", widget: "boolean", default: true}

      # ---------- BLOG TEASERS ----------
      - name: "posts"
        label: "Blog Teasers"
        file: "data/posts.json"
        fields:
          - {label: "Section title", name: "title", widget: "string"}
          - label: "Posts (first 3 show on homepage)"
            name: "posts"
            widget: "list"
            label_singular: "Post"
            summary: "{{fields.title}}"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false}
              - {label: "Category", name: "category", widget: "string"}
              - {label: "Image", name: "image", widget: "image", required: false}
              - {label: "Excerpt", name: "excerpt", widget: "text"}
              - {label: "Link", name: "link", widget: "string"}

      # ---------- CITY BOT ----------
      - name: "bot"
        label: "City Bot (virtual helper)"
        file: "data/bot.json"
        fields:
          - {label: "Bot name", name: "name", widget: "string"}
          - {label: "Avatar image (optional)", name: "avatar", widget: "image", required: false}
          - {label: "Auto-open after seconds (0 = off; desktop only, once per visit)", name: "autoOpenSeconds", widget: "number", value_type: "int", min: 0, max: 60}
          - {label: "Greeting", name: "greeting", widget: "text"}
          - {label: "Disclosure (keep: says it's automated, no advice, no health info)", name: "disclosure", widget: "text"}
          - {label: "Fallback answer", name: "fallback", widget: "text"}
          - label: "Quick options"
            name: "options"
            widget: "list"
            label_singular: "Option"
            summary: "{{fields.label}}"
            fields:
              - {label: "Button label", name: "label", widget: "string"}
              - {label: "Keywords (comma separated, for typed questions)", name: "keywords", widget: "string"}
              - {label: "Answer", name: "answer", widget: "text"}
              - label: "Action buttons"
                name: "actions"
                widget: "list"
                required: false
                fields:
                  - {label: "Label", name: "label", widget: "string"}
                  - {label: "Link", name: "link", widget: "string"}

  - name: "pages"
    label: "Pages"
    files:
      - name: "about"
        label: "About page"
        file: "data/about.json"
        fields:
          - {label: "Small label", name: "kicker", widget: "string"}
          - {label: "Headline", name: "headline", widget: "string"}
          - {label: "Intro", name: "intro", widget: "text"}
          - {label: "Photo (empty = headshot from Site Settings)", name: "photo", widget: "image", required: false}
          - {label: "Story paragraphs", name: "story", widget: "list", field: {label: "Paragraph", name: "p", widget: "text"}}
          - label: "Credentials"
            name: "credentials"
            widget: "list"
            summary: "{{fields.label}}"
            fields:
              - {label: "Credential", name: "label", widget: "string"}
              - {label: "Detail", name: "detail", widget: "string"}
          - {label: "Mission title", name: "missionTitle", widget: "string"}
          - {label: "Mission statement", name: "mission", widget: "text"}
          - label: "Values"
            name: "values"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Text", name: "text", widget: "text"}

      - name: "shop"
        label: "Shop page (consulting packages)"
        file: "data/shop.json"
        fields:
          - {label: "Small label", name: "kicker", widget: "string"}
          - {label: "Headline", name: "headline", widget: "string"}
          - {label: "Intro", name: "intro", widget: "text"}
          - label: "Packages"
            name: "packages"
            widget: "list"
            label_singular: "Package"
            summary: "{{fields.name}} — {{fields.price}}"
            fields:
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Price (e.g. $150 or Free)", name: "price", widget: "string"}
              - {label: "Billing (e.g. one time, per month)", name: "cadence", widget: "string", required: false}
              - {label: "Summary", name: "summary", widget: "text"}
              - {label: "What's included", name: "features", widget: "list", field: {label: "Item", name: "item", widget: "string"}}
              - {label: "Highlight as most popular", name: "featured", widget: "boolean", default: false}
              - {label: "Stripe Payment Link (empty = 'Request' button that emails you)", name: "stripeLink", widget: "string", required: false}
              - {label: "Button text when Stripe link is set", name: "buttonText", widget: "string", default: "Buy now"}
              - {label: "Button text when no Stripe link", name: "requestText", widget: "string", default: "Request this package"}
              - {label: "Show on site", name: "active", widget: "boolean", default: true}
          - {label: "Notes under packages", name: "notes", widget: "list", field: {label: "Note", name: "note", widget: "text"}}

      - name: "faq"
        label: "FAQ page"
        file: "data/faq.json"
        fields:
          - {label: "Small label", name: "kicker", widget: "string"}
          - {label: "Headline", name: "headline", widget: "string"}
          - {label: "Intro", name: "intro", widget: "text"}
          - label: "Topics"
            name: "groups"
            widget: "list"
            label_singular: "Topic"
            summary: "{{fields.title}}"
            fields:
              - {label: "Topic title", name: "title", widget: "string"}
              - label: "Questions"
                name: "items"
                widget: "list"
                label_singular: "Question"
                summary: "{{fields.q}}"
                fields:
                  - {label: "Question", name: "q", widget: "string"}
                  - {label: "Answer", name: "a", widget: "text"}
